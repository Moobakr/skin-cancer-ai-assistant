name: Build and smoke checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      MODEL_BUNDLE_DIR: ${{ github.workspace }}/empty_model_bundle
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            constraints-tested.txt
            .github/requirements-core.txt
      - name: Install core dependencies
        run: python -m pip install -c constraints-tested.txt -r .github/requirements-core.txt
      - name: Parse Python modules
        run: python -m compileall -q ai_model/src backend
      - name: Django system checks
        working-directory: backend
        run: python manage.py check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build
